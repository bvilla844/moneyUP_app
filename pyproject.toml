[project]
name = "moneyup-app"
version = "0.1.0"
description = "Personal finance control: income, expenses, debts and savings."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moneyup"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
